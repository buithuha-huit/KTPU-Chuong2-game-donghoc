<title>Đấu trường Động học</title>

<style>
/* Giao diện sáng, nhiều màu cho máy chiếu: thanh trên (vòng + điểm) · sân khấu · thanh điều khiển. Mỗi vòng một màu chủ đạo (--rc, --rc2). */
:root{
  --bg:#F5F3FF; --stage:#FFFFFF; --ink:#1A1F3A; --ink2:#454B6B; --muted:#6E7391; --line:#DCDDEB; --soft:#EEEDF8;
  --brand:#1B2A6B; --gold:#FACC15; --ok:#16A34A; --ok-bg:#DCFCE7; --bad:#E11D48; --bad-bg:#FFE4E6;
  --t0:#7C3AED; --t1:#0D9488; --t2:#EA580C; --t3:#2563EB;
  --oA:#F43F5E; --oB:#3B82F6; --oC:#F59E0B; --oD:#22C55E;
  --cL:#F26B3A; --cL2:#FFB13B; --cR:#2F7DE1; --cR2:#06B6D4;
  --display:'Lexend','Be Vietnam Pro',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:clamp(15px,1.05vw,20px)/1.5 var(--body);
  background:radial-gradient(1100px 600px at 0% 0%,#FFE4D3 0,transparent 60%),radial-gradient(900px 600px at 100% 0%,#DCE9FF 0,transparent 55%),radial-gradient(1000px 700px at 50% 110%,#E3F9EC 0,transparent 60%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
mjx-container{color:inherit}
.app{max-width:1640px;margin:0 auto;padding-block:12px 18px;display:flex;flex-direction:column;gap:12px;min-height:100%}

/* thanh trên */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:linear-gradient(110deg,#1B2A6B,#4B2A8C 55%,#9D2C7A);color:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px #4B2A8C33}
.logo{font-family:var(--display);font-weight:900;font-size:1.25em;white-space:nowrap}
.logo small{display:block;font:600 .6em/1.2 var(--body);opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:rgba(255,255,255,.08);color:#E4E6F7;border-radius:12px;padding:6px 11px;font-weight:700;font-size:.86em;display:flex;gap:6px;align-items:center}
.tabs button i{font-style:normal;width:1.55em;height:1.55em;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;font-size:.85em}
.tabs button[aria-current="page"]{background:#fff;color:var(--brand);box-shadow:0 0 0 3px var(--rc)}
.tabs button:not([aria-current]):hover{background:rgba(255,255,255,.2)}
#board{margin-left:auto}
.board4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:min(100%,660px)}
.team{background:#fff;color:var(--ink);border-radius:14px;padding:6px 10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;border-left:8px solid var(--tc);position:relative}
.team .nm{font-weight:800;font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tc)}
.team .sc{grid-row:span 3;font-family:var(--display);font-weight:900;font-size:2em;line-height:1;color:var(--tc);font-variant-numeric:tabular-nums}
.team .sub{font-size:.7em;color:var(--muted);font-weight:600}
.team .adj{display:flex;gap:4px}
.team .adj button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:0 7px;font-size:.72em;line-height:1.5}
.team.turn{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold);animation:turn 1.4s ease-in-out infinite}
@keyframes turn{50%{box-shadow:0 0 0 4px var(--gold),0 0 30px var(--gold)}}
.team.bump .sc,.clsb.bump .cl-s{animation:bump .7s ease}
@keyframes bump{30%{transform:scale(1.45)}}
.team .star{position:absolute;right:6px;top:-9px;font-size:.78em;background:var(--gold);color:var(--brand);border-radius:8px;padding:0 6px;font-weight:800}
.clsb{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:16px;padding:6px 16px;font-weight:800}
.cl-l{font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cl-s{font:900 2.1em/1 var(--display);background:linear-gradient(90deg,#F26B3A,#E0457B,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:2ch;display:inline-block}
.okc{color:var(--ok)}.bdc{color:var(--bad)}
.clsb .okc,.clsb .bdc,.clsb .run{font-size:1.15em;border-radius:12px;padding:2px 10px}
.clsb .okc{background:var(--ok-bg)}.clsb .bdc{background:var(--bad-bg)}
.clsb .run{background:#FFEDD5;color:#C2410C;animation:bump 1s ease}

/* sân khấu */
.stage{flex:1;background:var(--stage);border-radius:22px;padding:clamp(14px,2vw,30px);border:1px solid var(--line);border-top:8px solid var(--rc);display:flex;flex-direction:column;gap:14px;min-height:0;box-shadow:0 10px 30px #1B2A6B14}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.rnum{font-family:var(--display);font-weight:900;color:#fff;background:linear-gradient(120deg,var(--rc),var(--rc2));border-radius:12px;padding:3px 14px;font-size:.95em;box-shadow:0 4px 12px color-mix(in srgb,var(--rc) 40%,transparent)}
.rhead h1{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.1vw,40px);margin:0;letter-spacing:-.01em;color:var(--rc)}
.rhead .rule{color:var(--muted);font-size:.9em;flex-basis:100%}
.qcount{margin-left:auto;font-weight:800;color:var(--rc);font-variant-numeric:tabular-nums}
.prog{width:clamp(120px,14vw,240px);height:12px;border-radius:8px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rc),var(--rc2));border-radius:8px;transition:width .6s}
.qbox{font-size:clamp(20px,1.65vw,34px);line-height:1.5;font-weight:600;max-width:64ch;margin:0}
.qbox.sm{font-size:clamp(18px,1.4vw,28px);margin:0 0 8px}
.qbox.eq{margin:0 0 8px}
.qq{margin:0 0 8px;font-weight:800;font-size:1.05em;color:var(--rc)}
.ctx{color:var(--ink2);font-size:.95em;margin:0}

/* phương án */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid color-mix(in srgb,var(--oc) 40%,#fff);border-radius:16px;padding:12px 16px;font-size:clamp(17px,1.35vw,28px);
  background:color-mix(in srgb,var(--oc) 8%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--oc) 30%,#fff);min-width:0;transition:transform .15s,box-shadow .15s;position:relative}
button.opt:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 7px 0 color-mix(in srgb,var(--oc) 40%,#fff)}
button.opt:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--oc) 40%,#fff)}
button.opt:disabled{cursor:default}
.opt .lt{flex:none;width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;background:var(--oc);box-shadow:0 3px 0 color-mix(in srgb,var(--oc) 60%,#000)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 0 5px #16A34A33;animation:glow 1.3s ease 2}
.opt.right .lt{background:var(--ok)}
.opt.right::after{content:'✔';position:absolute;right:12px;top:6px;font-size:1.3em;color:var(--ok);font-weight:900}
@keyframes glow{50%{box-shadow:0 0 0 12px #16A34A22}}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.72;box-shadow:none}
.opt.wrong .lt{background:var(--bad)}
.opt.wrong::after{content:'✘';position:absolute;right:12px;top:6px;font-size:1.3em;color:var(--bad);font-weight:900}
.opt.dim{opacity:.38;box-shadow:none}
.opt .who{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.opt .ot{min-width:0}
.chip{border-radius:20px;padding:0 9px;font-size:.6em;font-weight:800;color:#fff;background:var(--tc);white-space:nowrap}
.why{border-left:6px solid var(--ok);background:var(--ok-bg);border-radius:0 14px 14px 0;padding:10px 16px;font-size:clamp(16px,1.2vw,24px);animation:slidein .5s ease}
.why b.h{color:var(--ok)}
.why.ask{border-left-color:var(--gold);background:#FEF9C3}.why.ask b.h{color:#A16207}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}}

/* thẻ chọn của các đội */
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk{border:3px solid var(--tc);border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:color-mix(in srgb,var(--tc) 6%,#fff)}
.pk .tn{font-weight:800;color:var(--tc);font-size:.85em;margin-right:auto}
.pk button{width:2.1em;height:2.1em;border-radius:50%;border:2px solid color-mix(in srgb,var(--oc) 50%,#fff);background:#fff;font-family:var(--display);font-weight:900;font-size:.85em;color:var(--oc)}
.pk button[aria-pressed="true"]{background:var(--oc);border-color:var(--oc);color:#fff;transform:scale(1.1)}
.pk.ok{background:var(--ok-bg)}.pk.no{background:var(--bad-bg)}

/* điều khiển */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #1B2A6B10}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:800}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:linear-gradient(120deg,#1B2A6B,#4B2A8C);border-color:transparent;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--brand)}
.btn.call{background:linear-gradient(120deg,#F26B3A,#E0457B);border-color:transparent;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.timer{font-family:var(--display);font-weight:900;font-size:1.6em;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center;color:var(--brand)}
.timer.low{color:var(--bad);animation:bump .5s infinite}
.sp{flex:1}
.hint{color:var(--muted);font-size:.85em;margin:0}

/* bảng số liệu */
.dtw{overflow-x:auto}
.dt{border-collapse:separate;border-spacing:0;font-size:clamp(17px,1.35vw,28px);font-variant-numeric:tabular-nums;border-radius:14px;overflow:hidden;border:2px solid color-mix(in srgb,var(--rc) 35%,#fff)}
.dt th,.dt td{padding:6px 18px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.dt th{background:color-mix(in srgb,var(--rc) 14%,#fff);font-weight:700;color:var(--ink)}
.dt tr:nth-child(even) td{background:color-mix(in srgb,var(--rc) 4%,#fff)}
.v3{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:22px;align-items:start}
.v3 .opts{grid-template-columns:minmax(0,1fr)}
.v3.nt{grid-template-columns:minmax(0,1fr)}.v3.nt .opts{grid-template-columns:repeat(2,minmax(0,1fr))}

/* vòng 2: lật thẻ, hai phía hai màu */
.mem2{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}
.side{border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.side.sL{background:linear-gradient(180deg,#FFE9DC,#FFF6EF)}.side.sR{background:linear-gradient(180deg,#DFEBFF,#F1F7FF)}
.side h3{margin:0;font:800 1em var(--display)}.side.sL h3{color:var(--cL)}.side.sR h3{color:var(--cR)}
.side .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1}
.card{position:relative;border:0;border-radius:16px;min-height:clamp(84px,9.5vh,150px);padding:0;background:transparent;perspective:900px}
.card .in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center;padding:8px 10px;text-align:center}
.card .b{color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(26px,2.6vw,48px);text-shadow:0 3px 0 #0003;box-shadow:0 5px 0 #0002}
.card.sL .b{background:radial-gradient(circle at 20% 20%,#ffffff33 0 10%,transparent 11%) 0 0/28px 28px,linear-gradient(135deg,var(--cL2),var(--cL) 60%,#E0457B)}
.card.sR .b{background:radial-gradient(circle at 20% 20%,#ffffff33 0 10%,transparent 11%) 0 0/28px 28px,linear-gradient(135deg,var(--cR2),var(--cR) 60%,#5B5BF0)}
.card:not(.up):hover .b{filter:brightness(1.08);transform:translateY(-2px)}
.card .f{transform:rotateY(180deg);border:3px solid var(--kc);font-size:clamp(14px,1.18vw,24px);padding-top:18px;line-height:1.35;overflow:hidden}
.card.sL{--kc:var(--cL)}.card.sR{--kc:var(--cR)}
.card.sL .f{background:#FFF5EE}.card.sR .f{background:#F0F6FF}
.card .f .tag{position:absolute;left:8px;top:4px;font:900 .75em var(--display);color:#fff;background:var(--kc);border-radius:8px;padding:0 7px}
.card.done .f{border-color:var(--ok);box-shadow:inset 0 0 0 3px #16A34A44}
.card.done .f::before{content:'✔';position:absolute;right:8px;top:2px;color:var(--ok);font-weight:900}
.card.done .f::after{content:attr(data-team);position:absolute;right:8px;bottom:4px;font-size:.62em;font-weight:800;color:#fff;background:var(--tc);border-radius:10px;padding:0 8px}
.card.done:not([data-team]) .f::after{display:none}
.card.miss .f{background:var(--bad-bg);border-color:var(--bad)}
.card.pulse .in{animation:pulse .8s ease}
@keyframes pulse{40%{transform:rotateY(180deg) scale(1.08)}}
.card .f mjx-container>svg{max-width:100%;height:auto}
.card .f.sm{font-size:clamp(12px,.88vw,18px)}

/* vòng 3: phân nhóm */
.pnq{color:var(--rc)}
.pnw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:16px;flex:1;align-items:stretch}
.bin{border-radius:22px;padding:12px;min-height:42vh;display:flex;flex-direction:column;gap:8px;border:3px dashed;text-align:left;transition:transform .2s}
.bin.b0{background:linear-gradient(180deg,#FFE4D6,#FFF6F0);border-color:var(--cL)}
.bin.b1{background:linear-gradient(180deg,#DCE9FF,#F2F7FF);border-color:var(--cR)}
.bin:not([aria-disabled]):hover{transform:scale(1.015)}
.bin .bh{display:block;text-align:center;color:#fff;border-radius:14px;padding:8px 10px;font:800 clamp(17px,1.35vw,26px)/1.3 var(--display)}
.bin.b0 .bh{background:linear-gradient(120deg,var(--cL2),var(--cL))}.bin.b1 .bh{background:linear-gradient(120deg,var(--cR2),var(--cR))}
.bin .drop{display:block;text-align:center;font-weight:800;min-height:1.4em;animation:bump 1s infinite}
.bin.b0 .drop{color:var(--cL)}.bin.b1 .drop{color:var(--cR)}
.placed{display:flex;gap:6px;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:6px 10px;font-size:clamp(14px,1vw,20px);animation:slidein .5s ease}
.bin.b0 .placed{border-left:6px solid var(--cL)}.bin.b1 .placed{border-left:6px solid var(--cR)}
.pile{display:flex;flex-direction:column;gap:8px;justify-content:center}
.itm{border:2px solid #CBD0E6;background:#fff;border-radius:14px;padding:10px 14px;font-size:clamp(15px,1.15vw,23px);text-align:left;box-shadow:0 4px 0 #CBD0E6;transition:transform .15s}
.itm:hover{transform:translateY(-2px)}
.itm.sel{border-color:#8B5CF6;background:#F3EEFF;box-shadow:0 0 0 5px #8B5CF655;transform:scale(1.03)}

/* vòng 5: đồ thị */
.v4{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.plotw{border:2px solid color-mix(in srgb,var(--rc) 25%,#fff);border-radius:16px;padding:10px 12px;background:#FBFCFF}
.plotw>svg{width:100%;height:auto;display:block;max-height:38vh}
.axl{display:flex;justify-content:space-between;gap:10px;font-size:clamp(14px,1.05vw,20px);color:var(--ink2);margin-top:4px}
.v4 .opts{grid-template-columns:minmax(0,1fr)}
.v4 .opt{font-size:clamp(15px,1.12vw,23px);padding:8px 12px}
.v4 .opts.g{grid-template-columns:repeat(2,minmax(0,1fr))}.v4 .opts.g .opt{flex-wrap:wrap;padding:6px 8px;gap:6px;align-items:flex-start}
.v4 .opts.g .ot{flex:1 1 70%;min-width:0}.mini{width:100%;height:auto;display:block;max-height:15vh}

/* vòng 6 */
.steps{display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-left:8px solid var(--oc,var(--line));border-radius:14px;padding:8px 14px;background:#fff;text-align:left;font-size:clamp(16px,1.25vw,26px);width:100%;transition:transform .15s}
.step:not(:disabled):hover{transform:translateX(4px)}
.step .lt{flex:none;width:1.9em;height:1.9em;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--oc,#888) 18%,#fff);color:var(--ink);font-family:var(--display);font-weight:900}
.step .no{margin-left:auto;flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-family:var(--display);font-weight:900;animation:bump .4s}
.step .no.gr{background:var(--muted)}
.step.on{background:#F3EEFF}
.step.ok{border-color:var(--ok);background:var(--ok-bg)}
.step.ln{border-left-color:var(--rc)}
.step.badl{border-color:var(--bad);background:var(--bad-bg)}
.step.wl{opacity:.5;text-decoration:line-through;text-decoration-color:var(--bad)}
.buzz{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.buzz button{border:3px solid var(--tc);background:#fff;border-radius:12px;padding:6px 14px;font-weight:800;color:var(--tc)}
.buzz button[aria-pressed="true"]{background:var(--tc);color:#fff}
.buzz button.tried{opacity:.45}
.banner{border-radius:14px;padding:10px 16px;font-weight:800;font-size:clamp(17px,1.3vw,26px);animation:slidein .5s ease}
.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.bad{background:var(--bad-bg);color:var(--bad)}

/* trang chủ */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(38px,4vw,72px);line-height:1;margin:0 0 12px;color:var(--brand);letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,#F26B3A,#E0457B,#8B5CF6,#2F7DE1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 12px;max-width:62ch;color:var(--ink2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.modes button{border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:transform .15s}
.modes button:hover{transform:translateY(-2px)}
.modes .me{font-size:1.8em;line-height:1.1}
.modes button b{font:900 1.2em var(--display)}.modes button span:not(.me){font-size:.8em;color:var(--muted)}

<script>
/* ================= NGÂN HÀNG CÂU HỎI – CHƯƠNG 2 (Sách BT KTPU, Bảng 2.1–2.9) ================= */
const R = String.raw;

/* ---------- Vòng 1: Khởi động ---------- */
const R1 = [
 {q:R`Hằng số tốc độ \(k = 0{,}05\ \mathrm{L\cdot mol^{-1}\cdot s^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:2,
  why:R`Đơn vị \(k\): \((\text{nồng độ})^{1-n}(\text{thời gian})^{-1}\). \(\mathrm{L\cdot mol^{-1}} = (\mathrm{mol/L})^{-1}\) nên \(1-n=-1\), \(n = 2\) (mục 2.1.4.6).`},
 {q:R`Hằng số tốc độ \(k = 2{,}5\times10^{-3}\ \mathrm{mol\cdot L^{-1}\cdot min^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:0,
  why:R`\(k\) có cùng đơn vị với tốc độ phản ứng: \((\mathrm{mol/L})^{1}\) nên \(1-n = 1\), \(n = 0\).`},
 {q:R`Hằng số tốc độ \(k = 0{,}12\ \mathrm{min^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:1,
  why:R`Không có thừa số nồng độ: \(1-n = 0\), \(n = 1\).`},
 {q:R`Hằng số tốc độ \(k = 4\ \mathrm{L^{2}\cdot mol^{-2}\cdot s^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:3,
  why:R`\((\mathrm{mol/L})^{-2}\) nên \(1-n = -2\), \(n = 3\).`},
 {q:R`Đúng hay sai: phản ứng bậc 1 có thời gian bán hủy \(t_{1/2}\) <b>không phụ thuộc</b> \(C_\mathrm{Ao}\).`,o:['Đúng','Sai'],a:0,
  why:R`\(t_{1/2} = \dfrac{\ln 2}{k}\) (Bảng 2.1).`},
 {q:R`Đúng hay sai: phản ứng bậc 0 có \(t_{1/2}\) <b>tỉ lệ nghịch</b> với \(C_\mathrm{Ao}\).`,o:['Đúng','Sai'],a:1,
  why:R`\(t_{1/2} = \dfrac{C_\mathrm{Ao}}{2k}\): tỉ lệ <b>thuận</b>. Tỉ lệ nghịch là bậc 2: \(t_{1/2} = \dfrac{1}{kC_\mathrm{Ao}}\).`},
 {q:R`Phản ứng pha khí A → 2B thực hiện đẳng áp, nhập liệu A nguyên chất. Hệ số thay đổi thể tích \(\varepsilon_\mathrm{A}\) bằng:`,o:['0','0,5','1','2'],a:2,
  why:R`\(\varepsilon_\mathrm{A} = \dfrac{N_{\text{tổng},X_\mathrm{A}=1}-N_{\text{tổng},X_\mathrm{A}=0}}{N_{\text{tổng},X_\mathrm{A}=0}} = \dfrac{2-1}{1} = 1\) (2.30).`},
 {q:R`Cũng phản ứng A → 2B nhưng nhập liệu gồm 50 % A và 50 % khí trơ (theo mol). \(\varepsilon_\mathrm{A}\) bằng:`,o:['0','0,5','1','2'],a:1,
  why:R`Ban đầu 0,5 A + 0,5 trơ = 1 mol; khi \(X_\mathrm{A}=1\): 1 B + 0,5 trơ = 1,5 mol. \(\varepsilon_\mathrm{A} = (1{,}5-1)/1 = 0{,}5\). Khí trơ làm giảm \(\varepsilon_\mathrm{A}\).`},
 {q:R`Đúng hay sai: đồ thị \(\ln k\) theo \(1/T\) là đường thẳng có hệ số góc \(-E_\mathrm{a}/R\).`,o:['Đúng','Sai'],a:0,
  why:R`\(\ln k = -\dfrac{E_\mathrm{a}}{RT} + \ln A\) (2.13): \(y = \ln k\), \(x = 1/T\).`},
 {q:R`Hai phản ứng có cùng \(k\) ở 300 K. Khi tăng nhiệt độ, phản ứng nào có \(k\) tăng nhanh hơn?`,o:[R`Phản ứng có \(E_\mathrm{a}\) lớn hơn`,R`Phản ứng có \(E_\mathrm{a}\) nhỏ hơn`,'Tăng như nhau','Không xác định được'],a:0,
  why:R`\(\ln\dfrac{k_{T_2}}{k_{T_1}} = -\dfrac{E_\mathrm{a}}{R}\left(\dfrac{1}{T_2}-\dfrac{1}{T_1}\right)\): \(E_\mathrm{a}\) càng lớn, tỉ số càng lớn.`}
];

/* ---------- Vòng 2: Lật thẻ ghép đôi (3 bảng × 8 cặp) ---------- */
const R2 = [
 {name:'Bảng 1 · Phương trình tích phân',pairs:[
  [R`Bất thuận nghịch <b>bậc 0</b>, pha lỏng: A → B`, R`\(C_\mathrm{Ao}-C_\mathrm{A}=kt\)`],
  [R`Bậc 1, pha khí A → 2B, <i>V</i> = const, theo áp suất riêng phần`, R`\(\ln\dfrac{p_\mathrm{Ao}}{p_\mathrm{A}}=kt\)`],
  [R`Bậc 2: A + B → R + S, \(C_\mathrm{Ao}=C_\mathrm{Bo}\)`, R`\(\dfrac{1}{C_\mathrm{A}}-\dfrac{1}{C_\mathrm{Ao}}=kt\)`],
  [R`Bậc 2: A + B → R + S, \(C_\mathrm{Ao}\neq C_\mathrm{Bo}\)`, R`\(\ln\dfrac{C_\mathrm{Ao}C_\mathrm{B}}{C_\mathrm{Bo}C_\mathrm{A}}=C_\mathrm{Ao}(M-1)kt\)`],
  [R`Thuận nghịch bậc 1, pha lỏng: A ⇄ R`, R`\(\ln\dfrac{C_\mathrm{Ao}-C_\mathrm{Ae}}{C_\mathrm{A}-C_\mathrm{Ae}}=(k_1+k_2)t\)`],
  [R`Thuận nghịch bậc 2: A + B ⇄ 2R hoặc 2A ⇄ R + S (\(C_\mathrm{Ao}=C_\mathrm{Bo}\); \(C_\mathrm{Ro}=C_\mathrm{So}=0\))`, R`\(\ln\dfrac{X_\mathrm{Ae}-(2X_\mathrm{Ae}-1)X_\mathrm{A}}{X_\mathrm{Ae}-X_\mathrm{A}}=2k_1\!\left(\dfrac{1}{X_\mathrm{Ae}}-1\right)\!C_\mathrm{Ao}t\)`],
  [R`Bất thuận nghịch <b>bậc <i>n</i></b> (<i>n</i> ≠ 1), <i>V</i> = const`, R`\(\dfrac{1}{C_\mathrm{A}^{\,n-1}}-\dfrac{1}{C_\mathrm{Ao}^{\,n-1}}=(n-1)kt\)`],
  [R`Bậc 1, thể tích thay đổi \(V=V_\mathrm{o}(1+\varepsilon_\mathrm{A}X_\mathrm{A})\): biểu diễn <i>V</i> theo <i>t</i>`, R`\(-\ln\!\left(1-\dfrac{\Delta V}{\varepsilon_\mathrm{A}V_\mathrm{o}}\right)=kt\)`]]},
 {name:'Bảng 2 · Theo độ chuyển hóa, áp suất tổng, thời gian bán hủy',pairs:[
  [R`Bậc 1, theo \(X_\mathrm{A}\), <i>V</i> = const`, R`\(-\ln(1-X_\mathrm{A})=kt\)`],
  [R`Bậc 2 (\(C_\mathrm{Ao}=C_\mathrm{Bo}\)), theo \(X_\mathrm{A}\)`, R`\(\dfrac{1}{C_\mathrm{Ao}}\dfrac{X_\mathrm{A}}{1-X_\mathrm{A}}=kt\)`],
  [R`Bậc 0, theo \(X_\mathrm{A}\), <i>V</i> = const`, R`\(C_\mathrm{Ao}X_\mathrm{A}=kt\)`],
  [R`Bậc 1 pha khí, bình kín, đo <b>áp suất tổng</b> <i>P</i>`, R`\(P-P_\mathrm{o}=\dfrac{\Delta n}{a}\,p_\mathrm{Ao}\left(1-e^{-kt}\right)\)`],
  [R`Bậc 0, thể tích thay đổi, theo \(X_\mathrm{A}\)`, R`\(\dfrac{C_\mathrm{Ao}}{\varepsilon_\mathrm{A}}\ln(1+\varepsilon_\mathrm{A}X_\mathrm{A})=kt\)`],
  [R`A + 2B → sản phẩm, <b>bậc 3</b>, \(M = C_\mathrm{Bo}/C_\mathrm{Ao}=2\)`, R`\(\dfrac{1}{C_\mathrm{A}^{2}}-\dfrac{1}{C_\mathrm{Ao}^{2}}=8kt\)`],
  [R`Thời gian bán hủy, bậc 0`, R`\(t_{1/2}=\dfrac{C_\mathrm{Ao}}{2k}\)`],
  [R`Thời gian bán hủy, bậc <i>n</i> (<i>n</i> ≠ 1)`, R`\(t_{1/2}=\dfrac{2^{\,n-1}-1}{(n-1)kC_\mathrm{Ao}^{\,n-1}}\)`]]},
 {name:'Bảng 3 · Phương trình động học vi phân',pairs:[
  [R`Bậc 2: A + B → sp, \(C_\mathrm{Ao}\neq C_\mathrm{Bo}\), theo \(X_\mathrm{A}\)`, R`\(\dfrac{dX_\mathrm{A}}{dt}=kC_\mathrm{Ao}(1-X_\mathrm{A})(M-X_\mathrm{A})\)`],
  [R`A + 2B → sp, bậc 2, theo \(X_\mathrm{A}\)`, R`\(\dfrac{dX_\mathrm{A}}{dt}=kC_\mathrm{Ao}(1-X_\mathrm{A})(M-2X_\mathrm{A})\)`],
  [R`Thuận nghịch bậc 1, theo \(X_\mathrm{A}\)`, R`\(\dfrac{dX_\mathrm{A}}{dt}=(k_1+k_2)(X_\mathrm{Ae}-X_\mathrm{A})\)`],
  [R`Thuận nghịch bậc 2: A + B ⇄ R + S`, R`\(-\dfrac{dC_\mathrm{A}}{dt}=k_1C_\mathrm{A}C_\mathrm{B}-k_2C_\mathrm{R}C_\mathrm{S}\)`],
  [R`Bậc 2 pha khí, theo áp suất riêng phần`, R`\(-\dfrac{dp_\mathrm{A}}{dt}=k'p_\mathrm{A}^{2},\ \ k'=\dfrac{k}{RT}\)`],
  [R`Bậc 0 pha khí, theo áp suất riêng phần`, R`\(-\dfrac{dp_\mathrm{A}}{dt}=kRT\)`],
  [R`Bậc 1, thể tích thay đổi, theo \(X_\mathrm{A}\)`, R`\(\dfrac{C_\mathrm{Ao}}{1+\varepsilon_\mathrm{A}X_\mathrm{A}}\dfrac{dX_\mathrm{A}}{dt}=kC_\mathrm{Ao}\dfrac{1-X_\mathrm{A}}{1+\varepsilon_\mathrm{A}X_\mathrm{A}}\)`],
  [R`Bậc <i>n</i>, <i>V</i> = const, theo \(X_\mathrm{A}\)`, R`\(\dfrac{dX_\mathrm{A}}{dt}=kC_\mathrm{Ao}^{\,n-1}(1-X_\mathrm{A})^{n}\)`]]}
];

/* ---------- Vòng 3: Thám tử số liệu ---------- */
const M = {TP:'Phương pháp tích phân',VP:'Phương pháp vi phân',BH:'Phương pháp thời gian bán hủy',TD:'Phương pháp tốc độ đầu',CL:'Phương pháp cô lập (dùng dư một chất)',AR:'Phương trình Arrhenius'};
const R3 = [
 {ctx:'Phản ứng pha lỏng A → sản phẩm trong bình gián đoạn. Một thí nghiệm duy nhất, cần tìm <i>n</i> và <i>k</i>.',
  head:[R`\(t\) (min)`,R`\(C_\mathrm{A}\) (mol/L)`],rows:[[0,'1,000'],[5,'0,607'],[10,'0,368'],[15,'0,223'],[20,'0,135'],[30,'0,050']],
  o:[M.TP,M.BH,M.TD,M.AR],a:0,
  why:R`Chỉ có \(C_\mathrm{A}\) theo \(t\) của một thí nghiệm: thử \(n = 0, 1, 2\) bằng PT tích phân (vẽ \(C_\mathrm{A}\), \(\ln C_\mathrm{A}\), \(1/C_\mathrm{A}\) theo \(t\)). Ở đây \(\ln C_\mathrm{A}\) theo \(t\) thẳng: bậc 1, \(k = 0{,}1\ \mathrm{min^{-1}}\).`},
 {ctx:'Nhiều thí nghiệm với nồng độ đầu khác nhau; mỗi thí nghiệm chỉ ghi thời gian để A còn một nửa.',
  head:[R`\(C_\mathrm{Ao}\) (mol/L)`,R`\(t_{1/2}\) (min)`],rows:[['0,5','4,0'],['1,0','2,0'],['2,0','1,0'],['4,0','0,5']],
  o:[M.TP,M.AR,M.CL,M.BH],a:3,
  why:R`Vẽ \(\ln t_{1/2}\) theo \(\ln C_\mathrm{Ao}\): hệ số góc \(1-n = -1\), suy ra \(n = 2\); \(k = 1/(t_{1/2}C_\mathrm{Ao}) = 0{,}5\ \mathrm{L\cdot mol^{-1}\cdot min^{-1}}\).`},
 {ctx:'Đo được tốc độ phản ứng ứng với từng nồng độ A (ví dụ trong thiết bị dòng liên tục hoặc từ tiếp tuyến đường cong).',

  FX.parts.forEach(p=>{p.life++;p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;
    if(p.sh===0)g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.sh===1){g.beginPath();g.arc(0,0,p.s/2.6,0,7);g.fill();}
    else{g.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.5708;g.lineTo(Math.cos(a)*p.s/1.6,Math.sin(a)*p.s/1.6);g.lineTo(Math.cos(a+.628)*p.s/3.4,Math.sin(a+.628)*p.s/3.4);}g.fill();}

function norm(pts){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return pts.map(([x,y])=>[(x-x0)/((x1-x0)||1),(y-y0)/((y1-y0)||1)]);}
function drawPlot(it,t){const svg=$('#plot');if(!svg)return;
  const A=norm(it.raw.pts),B=norm(it.raw.pts.map(([x,y])=>it.lin.f(x,y)));
  const W=600,H=340,L=46,Rr=20,T=18,Bt=34,pw=W-L-Rr,ph=H-T-Bt;
  const P=A.map((a,k)=>[a[0]*(1-t)+B[k][0]*t,a[1]*(1-t)+B[k][1]*t]).map(([u,v])=>[L+16+u*(pw-32),T+12+(1-v)*(ph-24)]);
  let s=`<line x1="${L}" y1="${H-Bt}" x2="${W-Rr}" y2="${H-Bt}" stroke="#13213A" stroke-width="2.5"/><line x1="${L}" y1="${H-Bt}" x2="${L}" y2="${T}" stroke="#13213A" stroke-width="2.5"/>
   <path d="M${W-Rr},${H-Bt} l-10,-5 v10z M${L},${T} l-5,10 h10z" fill="#13213A"/>`;
  s+=`<polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${t>=1?'#1E8E4F':'#2E86AB'}" stroke-width="${t>=1?4:3}" stroke-linejoin="round" ${t>=1?'stroke-dasharray="0"':''}/>`;
  s+=P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="7" fill="#fff" stroke="#14325C" stroke-width="3"/>`).join('');
  svg.innerHTML=s;}
function animPlot(it){const t0=performance.now(),D=1300;
  const xl=$('#xlab'),yl=$('#ylab');if(xl&&yl){xl.innerHTML='Trục hoành: '+it.lin.xl;yl.innerHTML='Trục tung: '+it.lin.yl;tset($('.axl'));}
  const reduce=RM();
  const step=now=>{let t=reduce?1:Math.max(0,Math.min(1,(now-t0)/D));t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;drawPlot(it,t);if(t<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

    ${lop?`<td><b>${st.pts}</b></td>`:S.teams.map((_,t)=>`<td>${S.sc[r][t]}</td>`).join('')}</tr>`;}).join('');
  const T=RK.reduce((a,r)=>({ok:a.ok+S.st[r].ok,bad:a.bad+S.st[r].bad,pts:a.pts+S.st[r].pts}),{ok:0,bad:0,pts:0});
  const redo=[];['r1','r3','r4'].forEach(r=>Object.entries(S[r].q).forEach(([i,q])=>{const it=BK(r)[i];if(!it)return;const w=lop?q.tried.length:q.pick.filter(p=>p!==null&&p!==it.a).length;if(w||q.shown)redo.push({r,i:+i,w,txt:r==='r1'?it.q:it.ctx});}));
  Object.entries(S.r5.q).forEach(([i,q])=>{const w=lop?q.fails:q.tried.length;if(w||(q.rev&&q.res!=='ok'))redo.push({r:'r5',i:+i,w,txt:esc(R5[i].title)});});
  redo.sort((a,b)=>b.w-a.w);
  const rk=S.teams.map((t,i)=>({...t,i,s:tot(i)})).sort((a,b)=>b.s-a.s);
  $('#stage').innerHTML=`<div class="rhead"><span class="rnum">Kết thúc</span><h1>${lop?'Tổng kết cả lớp':'Bảng vàng Đấu trường Động học'}</h1></div>
   ${lop?`<div class="stats"><div class="t-pts"><b>${T.pts}</b><span>tổng điểm của lớp</span></div><div class="t-ok"><b>${T.ok}</b><span>lần đúng</span></div><div class="t-bad"><b>${T.bad}</b><span>lần sai</span></div><div><b>${acc(T)} %</b><span>tỉ lệ đúng</span></div></div>`
    :`<div class="pod">${rk.map((t,k)=>`<div class="col" style="--tc:${TCOL[t.i]};--d:${k*.15}s"><div class="rk">${['🥇','🥈','🥉','🎖️'][k]}</div><div class="nm">${esc(t.name)}</div><div class="bar" style="height:${Math.max(60,Math.round(220*Math.max(t.s,0)/Math.max(1,...rk.map(x=>x.s))))}px">${t.s}</div></div>`).join('')}</div>`}
   <div class="tblw"><table class="tbl"><thead><tr><th>Vòng</th><th>✔ Đúng</th><th>✘ Sai</th><th>Tỉ lệ</th><th>Sao</th>${lop?'<th>Điểm</th>':S.teams.map((t,i)=>`<th style="color:${TCOL[i]}">${esc(t.name)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>Tổng</td><td class="okc">${T.ok}</td><td class="bdc">${T.bad}</td><td>${acc(T)} %</td><td></td>${lop?`<td><b>${T.pts}</b></td>`:S.teams.map((_,i)=>`<td><b>${tot(i)}</b></td>`).join('')}</tr></tfoot></table></div>
   ${redo.length?`<h2 class="sumh">Câu nên giảng lại (nhiều lần sai xếp trước)</h2><div class="sum">${redo.slice(0,8).map(x=>`<button class="srow" data-jump="${x.r}:${x.i}"><span class="sv">Vòng ${RD[x.r].n} · câu ${x.i+1}</span><span class="st">${x.txt}</span><span class="sw">${x.w?`${x.w} lần sai`:'chưa ai đúng'}</span></button>`).join('')}</div>`:''}
   <p class="vhead">📽 Video ôn tập</p>${vBtns(['tq0','tp0','vp0','bh0'])}`;
  $('#ctrl').innerHTML=`<button class="btn" data-go="home">🏠 Về trang đầu</button><span class="sp"></span><button class="btn" id="resetAsk">Chơi lại tất cả</button>`;}

function nav(n){const r=S.view,L=BK(r).length,ni=S[r].i+n;if(ni>=L){S.kq=r;return go('kq');}if(ni<0)return;S[r].i=ni;save();tReset(TDEF[r]);render();}
document.addEventListener('click',e=>{const call=e.target.closest('#call');if(call){if(call.classList.contains('done'))call.hidden=true;return;}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go)return go(d.go);
  if(d.mode){if(d.mode===S.mode)return;const any=RK.some(r=>S.st[r].ok+S.st[r].bad||S.sc[r].some(x=>x));
    if(any&&!d.force){$('#cf')?.remove();($('#rst')||$('#stage')).insertAdjacentHTML('afterbegin',`<div class="confirm" id="cf">Đổi chế độ sẽ xóa điểm và tiến độ đang có. <button class="btn pri" data-mode="${d.mode}" data-force="1">Đổi và chơi mới</button><button class="btn" id="resetNo">Giữ chế độ cũ</button></div>`);return;}
    const keep={teams:S.teams,size:S.size,roster:S.roster,mute:S.mute};S=fresh();Object.assign(S,keep);S.mode=d.mode;HIST.length=0;save();render();return;}
  if(d.jump){const [r,i]=d.jump.split(':');S[r].i=+i;return go(r);}
  if(b.id==='callsv')return callSV();
  if(b.id==='recall'){S.called=[];save();b.textContent='✓ Đã làm mới';setTimeout(()=>{b.textContent='↻ Gọi lại từ đầu';},1200);return;}
  if(d.adj){snap();const [t,v]=d.adj.split(':').map(Number);S.sc[CR()][t]+=v;save();renderBoard([t]);return;}
  if(b.id==='undo')return undo();
  if(b.id==='tmb'){TM.run?tPause():tStart(TM.left>0?0:TDEF[CR()]);return;}
  if(b.id==='mute'){S.mute=!S.mute;save();b.textContent=S.mute?'🔇 Bật âm thanh':'🔊 Tắt âm thanh';return;}
  if(b.id==='resetAsk'){const box=$('#rst')||$('#stage');box.insertAdjacentHTML('afterbegin',`<div class="confirm" id="cf">Xóa toàn bộ điểm và tiến độ của cả 6 vòng? <button class="btn pri" id="resetYes">Xóa và chơi lại</button><button class="btn" id="resetNo">Giữ nguyên</button></div>`);return;}
  if(b.id==='resetNo'){$('#cf')?.remove();return;}
  if(b.id==='resetYes'){const keep={teams:S.teams,mode:S.mode,size:S.size,roster:S.roster,mute:S.mute,sv:S.sv,sent:S.sent,gq:S.gq};S=fresh();Object.assign(S,keep);HIST.length=0;save();go('home');return;}
  if(b.id==='replay'){snap();const r=S.kq;S[r]=freshRound(r);S.st[r]=fst();S.sc[r]=[0,0,0,0];if(r==='r5')S.r5.starUsed=[false,false,false,false];save();go(r);return;}
  if(b.id==='endr'){S.kq=S.view;return go('kq');}
  if(d.ans!==undefined)return answer(+d.ans);
  if(b.id==='hint'){const r=S.view,q=qs(r,S[r].i);q.hint=true;save();render();tone(988,.12,'sine',.07);return;}
  if(d.pick){const [t,k]=d.pick.split(':').map(Number),r=S.view,q=qs(r,S[r].i);if(q.done)return;q.pick[t]=q.pick[t]===k?null:k;save();sSel();
    b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b&&q.pick[t]===k));return;}
  if(b.id==='reveal')return reveal();
  if(d.nav){const n=+d.nav;if(S.view==='r5'){const L=R5.length,ni=S.r5.i+n;if(ni>=L){S.kq='r5';return go('kq');}if(ni<0)return;S.r5.i=ni;save();tReset(TDEF.r5);render();return;}return nav(n);}
  if(d.card!==undefined)return flip(d.card);
  if(d.board!==undefined){S.r2.b=+d.board;save();render();return;}
  if(b.id==='turn'){S.r2.turn=(S.r2.turn+1)%4;save();render();return;}
  if(b.id==='openall'){S.r2.open=!S.r2.open;save();render();return;}
  if(b.id==='reshuf'){delete S.r2.decks[S.r2.b];save();render();return;}
  if(d.pnb!==undefined){S.pn.b=+d.pnb;S.pn.sel=null;save();render();return;}
  if(d.itm!==undefined){const i=+d.itm;S.pn.sel=S.pn.sel===i?null:i;sSel();save();render();return;}
  if(d.bin!==undefined)return pnDrop(+d.bin);
  if(b.id==='pnturn'){S.pn.turn=(S.pn.turn+1)%4;save();render();return;}
  if(b.id==='pnshuf'){delete S.pn.ord[S.pn.b];S.pn.sel=null;save();render();return;}
  if(d.star!==undefined){const q=q5(S.r5.i),t=+d.star;q.star=q.star===t?null:t;save();render();return;}
  if(d.buzz!==undefined){const q=q5(S.r5.i),t=+d.buzz;q.buzz=q.buzz===t?null:t;q.picks=[];q.res=q.res==='bad'?null:q.res;save();render();if(q.buzz!==null){sSel();tStart(TDEF.r5);}return;}
  if(d.step!==undefined){const i=S.r5.i,it=R5[i],q=q5(i),sk=+d.step;if((!LOP()&&q.buzz===null)||q.picks.includes(sk))return;q.picks.push(sk);sSel();save();
    if(q.picks.length===it.steps.length)return judge5(q.picks.every((v,k)=>v===k));render();return;}
  if(d.line!==undefined){const i=S.r5.i,q=q5(i),k=+d.line;if(!LOP()&&q.buzz===null)return;return judge5(k===R5[i].bad,k);}
  if(b.id==='clr'){const q=q5(S.r5.i);q.picks=[];save();render();return;}
  if(b.id==='show5'){snap();const q=q5(S.r5.i);q.rev=true;S.st.r5.run=0;tPause();save();render();return;}
});
document.addEventListener('input',e=>{const t=e.target.dataset.tn;if(t!==undefined){S.teams[+t].name=e.target.value||('Đội '+(+t+1));save();renderBoard();return;}
  if(e.target.id==='size'){S.size=Math.max(1,Math.min(300,+e.target.value||40));S.called=[];save();}
  if(e.target.id==='roster')setRoster(e.target.value);});
document.addEventListener('keydown',e=>{if(e.target.closest('input'))return;const k=e.key.toLowerCase();
  if(!$('#call').hidden&&(k==='escape'||k==='enter'||k===' ')){$('#call').hidden=true;e.preventDefault();return;}
  if(k==='arrowright')document.querySelector('[data-nav="1"]')?.click();
  else if(k==='arrowleft')document.querySelector('[data-nav="-1"]')?.click();
  else if(k==='enter'&&['r1','r3','r4'].includes(S.view)){e.preventDefault();reveal();}
  else if(LOP()&&['a','b','c','d'].includes(k)&&['r1','r3','r4'].includes(S.view))answer(k.charCodeAt(0)-97);
  else if(k==='g'&&LOP()&&!NHA)callSV();
  else if(k==='t')$('#tmb')?.click();});

/* ================= THẺ GHI NHỚ (flashcard có hình động) – khung dùng chung ================= */
/* Gói trong một khối riêng để không trùng tên với hàm vẽ của các vòng chơi. Thêm thẻ: thêm một mục vào mảng FC. */
const FCX=(()=>{
let FUID=0;
const FCOL={b:'#2E86AB',o:'#E07A1F',r:'#C0392B',g:'#1E8E4F',p:'#7C3AED',y:'#D49B00'};
const FINK='#14325C',FLB='#3B8FE0',FLP='#8E44AD';
const sb=s=>`<tspan baseline-shift="sub" font-size="72%">${s}</tspan>`;
const sp=s=>`<tspan baseline-shift="super" font-size="72%">${s}</tspan>`;
const iv=s=>`<tspan font-style="italic">${s}</tspan>`;
const CA=`${iv('C')}${sb('A')}`,CAo=`${iv('C')}${sb('Ao')}`,XA=`${iv('X')}${sb('A')}`,TAU=iv('τ'),VO=`${iv('υ')}${sb('o')}`;
const RA=`(−${iv('r')}${sb('A')})`,INVR=`1/${RA}`;
const stx=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.fs||19}" font-weight="${o.fw||700}" text-anchor="${o.a||'middle'}" fill="${o.c||FINK}" paint-order="stroke" stroke="${o.st||'#fff'}" stroke-width="${o.sw??5}">${t}</text>`;
const draw=(d,c,w,dur,o={})=>`<path d="${d}" fill="${o.fill||'none'}" stroke="${c}" stroke-width="${w}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" ${o.extra||''}><animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.85;1" dur="${dur}s" begin="${o.begin||0}s" repeatCount="${o.rep||'indefinite'}" fill="freeze"/></path>`;
const draw1=(d,c,w,dur,begin,extra='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke-linecap="round" ${extra}><animate attributeName="stroke-dashoffset" from="1" to="0" dur="${dur}s" begin="${begin}s" fill="freeze"/></path>`;
const fadeIn=(s,b,d=.5)=>`<g opacity="0">${s}<animate attributeName="opacity" from="0" to="1" dur="${d}s" begin="${b}s" fill="freeze"/></g>`;
const fadeOut=(s,b,d=.5)=>`<g>${s}<animate attributeName="opacity" from="1" to="0" dur="${d}s" begin="${b}s" fill="freeze"/></g>`;
const stamp=(x,y,t,c,b)=>`<g opacity="0" transform="translate(${x},${y})"><g><rect x="-62" y="-20" width="124" height="38" rx="10" fill="#fff" stroke="${c}" stroke-width="3.5"/>${stx(0,8,t,{fs:20,fw:900,c,sw:0})}
  <animateTransform attributeName="transform" type="scale" values="2.2;.9;1" keyTimes="0;.7;1" dur=".45s" begin="${b}s" fill="freeze"/></g><animate attributeName="opacity" from="0" to="1" dur=".2s" begin="${b}s" fill="freeze"/></g>`;
const mix=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(a.substr(i,2),16)*(1-t)+parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const liq=X=>mix(FLB,FLP,Math.min(1,X));
const arr=(x1,y1,x2,y2,c=FINK,w=3)=>{const a=Math.atan2(y2-y1,x2-x1),h=11;
  return `<line x1="${x1}" y1="${y1}" x2="${x2-Math.cos(a)*h*.8}" y2="${y2-Math.sin(a)*h*.8}" stroke="${c}" stroke-width="${w}"/><path d="M${x2},${y2} l${(-h*Math.cos(a)+h*.55*Math.sin(a)).toFixed(1)},${(-h*Math.sin(a)-h*.55*Math.cos(a)).toFixed(1)} l${(-h*1.1*Math.sin(a)).toFixed(1)},${(h*1.1*Math.cos(a)).toFixed(1)}z" fill="${c}"/>`;};
const flow=(p,c,n,dur,r=5)=>{let s='';for(let k=0;k<n;k++)s+=`<circle r="${r}" fill="${c}" stroke="#fff" stroke-width="1.5"><animateMotion dur="${dur}s" begin="-${(k*dur/n).toFixed(2)}s" repeatCount="indefinite" path="${p}"/></circle>`;return s;};
const fmt=(v,d)=>String(+(+v).toFixed(d)).replace('.',',');
const poly=(pts)=>pts.map((q,k)=>(k?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
function fax(W,H,L,Rr,T,Bt,sw){return `<line x1="${L}" y1="${H-Bt}" x2="${W-Rr}" y2="${H-Bt}" stroke="#13213A" stroke-width="${sw}"/><line x1="${L}" y1="${H-Bt}" x2="${L}" y2="${T}" stroke="#13213A" stroke-width="${sw}"/>
   <path d="M${W-Rr},${H-Bt} l-${3*sw},-${2*sw} v${4*sw}z M${L},${T} l-${2*sw},${3*sw} h${4*sw}z" fill="#13213A"/>`;}
/* bình khuấy nhỏ: x trái, y miệng, rộng w, cao h, màu chất lỏng c */
function tank(x,y,w,h,c,lab){const cx=x+w/2,b=y+h;let sw='';
  for(let k=0;k<6;k++){const sg=k%2?1:-1,p=`M${cx},${b-12} C${cx+sg*w*.38},${b-12} ${cx+sg*w*.38},${y+20} ${cx+sg*w*.15},${y+20} C${cx},${y+20} ${cx},${(b+y)/2} ${cx},${b-12}`;
    sw+=`<circle r="3.2" fill="#fff" opacity=".85"><animateMotion dur="2.2s" begin="-${(k*.37).toFixed(2)}s" repeatCount="indefinite" path="${p}"/></circle>`;}
  return `<path d="M${x},${y} V${b-14} Q${x},${b} ${x+14},${b} H${x+w-14} Q${x+w},${b} ${x+w},${b-14} V${y}" fill="#fff" stroke="${FINK}" stroke-width="3"/>
   <path d="M${x+3},${y+12} V${b-14} Q${x+3},${b-3} ${x+14},${b-3} H${x+w-14} Q${x+w-3},${b-3} ${x+w-3},${b-14} V${y+12} Z" fill="${c}"/>${sw}
   <line x1="${cx}" y1="${y-12}" x2="${cx}" y2="${b-14}" stroke="${FINK}" stroke-width="3.5"/><rect x="${cx-9}" y="${y-22}" width="18" height="12" rx="3" fill="#5B6B86" stroke="${FINK}" stroke-width="1.5"/>
   <g transform="translate(${cx},${b-14})"><g><rect x="-${w*.3}" y="-4" width="${w*.6}" height="8" rx="3" fill="${FINK}"/><animateTransform attributeName="transform" type="scale" values="1 1;0.12 1;-1 1;0.12 1;1 1" dur=".8s" repeatCount="indefinite"/></g></g>
   ${lab?stx(cx,b+22,lab,{fs:16}):''}`;}
/* ống dòng đẩy (như mô hình PFR chương 3): các lát mỏng trôi dọc ống, mỗi lát có các phân tử xếp thẳng hàng, chỉ dao động lên – xuống; màu lát đổi từ X0 đến X1 */
function tube(x,y,w,h,X0,X1,D,tag=''){const id='tb'+(++FUID);let sl='';const NS=6,ih=h-8,n=Math.max(1,Math.min(5,Math.floor(ih/12))),r=Math.min(4.6,ih/(2*n+1));
  for(let k=0;k<NS;k++){const b=-(k*D/NS).toFixed(2);let m='';
    for(let j=0;j<n;j++){const cy=y+4+ih*(j+.5)/n,ph=((j*.37+k*.21)%1*.5).toFixed(2);
      m+=`<circle cx="6" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" stroke="${FINK}" stroke-width="1.1"><animate attributeName="cy" values="${(cy-2.5).toFixed(1)};${(cy+2.5).toFixed(1)};${(cy-2.5).toFixed(1)}" dur=".5s" begin="-${ph}s" repeatCount="indefinite"/></circle>`;}
    sl+=`<g><animateTransform attributeName="transform" type="translate" values="${x+6},0;${x+w-18},0" dur="${D}s" begin="${b}s" repeatCount="indefinite"/>
     <rect x="0" y="${y+4}" width="12" height="${ih}" rx="2" fill="${liq(X0)}" stroke="#fff" stroke-width="1.5"><animate attributeName="fill" values="${liq(X0)};${liq(X1)}" dur="${D}s" begin="${b}s" repeatCount="indefinite"/></rect>${m}</g>`;}
  return `<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${liq(X0)}" stop-opacity=".5"/><stop offset="1" stop-color="${liq(X1)}" stop-opacity=".5"/></linearGradient></defs>
   <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(12,h/3)}" fill="url(#${id})" stroke="${FINK}" stroke-width="3"/>${sl}${tag}`;}

/* ---- đồ thị Levenspiel có tô diện tích động ---- */
function levG(A,W,H,L,Rr,T,Bt){const pw=W-L-Rr,ph=H-T-Bt;
  return {pw,ph,X:x=>L+(x-A.x0)/(A.x1-A.x0)*pw,Y:y=>H-Bt-Math.min(y,A.y1)/A.y1*ph};}
const crv=(f,a,b,X,Y,n=90)=>Array.from({length:n+1},(_,k)=>{const x=a+(b-a)*k/n;return [X(x),Y(f(x))];});
function shp(f,sh,X,Y){if(sh.k==='R')return `M${X(sh.a)},${Y(0)} V${Y(f(sh.h))} H${X(sh.b)} V${Y(0)} Z`;
  return `M${X(sh.a)},${Y(0)} `+crv(f,sh.a,sh.b,X,Y,60).map(q=>'L'+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+` L${X(sh.b)},${Y(0)} Z`;}
const fpat=(id,c,ang=45)=>`<pattern id="${id}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><rect width="9" height="9" fill="${c}" fill-opacity=".16"/><line x1="0" y1="0" x2="0" y2="9" stroke="${c}" stroke-width="2.4"/></pattern>`;
const ANG={b:45,o:-45,r:-45,g:0,p:90,y:45};
const PLOT={W:520,H:330,L:64,Rr:18,T:22,Bt:46};
function frame(o){const {W,H,L,Rr,T,Bt}=PLOT,A={x0:0,x1:o.x1||1,y1:o.y1},{X,Y,pw}=levG(A,W,H,L,Rr,T,Bt),id='L'+(++FUID);
  let s=(o.yt||[]).map(y=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(y)}" y2="${Y(y)}" stroke="#E3E8F0"/>${stx(L-8,Y(y)+6,fmt(y,o.yf||0),{a:'end',fs:16,fw:600,sw:0})}`).join('');
  s+=(o.xt||[0,.2,.4,.6,.8,1]).map(x=>stx(X(x),H-16,fmt(x,o.xf??1),{fs:16,fw:600,sw:0})).join('');
  return {X,Y,pw,id,s,L,W,H,T,Bt,Rr};}
function lev(o,anim){const F=frame(o),{X,Y,pw,id,L,W,H,T,Bt,Rr}=F,cv=o.curves,sh=anim?(o.sh||[]):[],st=o.step||1.7;
  let s=`<svg class="fsv" viewBox="0 0 ${W} ${H}" role="img" aria-label="Đồ thị Levenspiel"><defs>`+Object.entries(FCOL).map(([k,c])=>fpat(id+k,c,ANG[k])).join('');
  sh.forEach((q,j)=>{s+=`<clipPath id="${id}c${j}"><rect x="${L}" y="0" width="0" height="${H}"><animate attributeName="width" from="0" to="${pw}" dur="1.3s" begin="${(0.4+j*st).toFixed(1)}s" fill="freeze"/></rect></clipPath>`;});
  s+='</defs>'+F.s;
  let labs='';sh.forEach((q,j)=>{const f=cv[q.ci||0].f,c=FCOL[q.c||'b'];
    s+=`<g clip-path="url(#${id}c${j})"><path d="${shp(f,q,X,Y)}" fill="url(#${id}${q.c||'b'})" stroke="${c}" stroke-width="${q.dash?3.5:2.5}" ${q.dash?'stroke-dasharray="9 6"':''}/></g>`;
    if(q.lab)labs+=fadeIn(stx(X(q.lx),Y(q.ly),q.lab,{c,fs:q.fs||18}),(1.5+j*st).toFixed(1),.4);});
  s+=fax(W,H,L,Rr,T,Bt,2.5);
  cv.forEach(it=>{const p=crv(it.f,it.xmin||0,it.xmax,X,Y,160),col=it.c?FCOL[it.c]:FINK;
    s+=`<polyline points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round"/>`;
    if(it.lab){const e=p[p.length-1];s+=stx(e[0]-8,Math.max(T+16,e[1]+(it.ldy||0)),it.lab,{a:'end',fs:17,c:col});}});
  (o.pts||[]).forEach(x=>{s+=`<circle cx="${X(x).toFixed(1)}" cy="${Y(cv[0].f(x)).toFixed(1)}" r="6" fill="#fff" stroke="${FINK}" stroke-width="3"/>`;});
  (anim&&o.guide||[]).forEach(g=>{s+=`<path d="M${X(g)},${Y(0)} V${Y(cv[0].f(g))} H${L}" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-dasharray="7 5"/>`;});
  s+=labs+stx(o.ylx||L+8,T+10,o.yl||INVR,{a:'start',fs:18})+stx(W-Rr,H-Bt-10,o.xl||XA,{a:'end',fs:18});
  (anim&&o.leg||[]).forEach(([c,t],k)=>{const y=T+30+k*27,x=o.legx||L+40;
    s+=fadeIn(`<rect x="${x}" y="${y}" width="26" height="16" fill="url(#${id}${c})" stroke="${FCOL[c]}" stroke-width="2.5"/>${stx(x+34,y+14,t,{a:'start',fs:17,c:FCOL[c]})}`,(1.5+k*st).toFixed(1),.4);});

/* ---- đồ thị “biến hình”: số liệu thô → dạng tuyến tính, vẽ đường thẳng, tam giác hệ số góc ----
   o = {raw:{xl,yl,pts,curves:[{f,x0,x1,c,lab}],hline:{y,lab}}, lin:{xl,yl,f:(x,y)=>[X,Y],ext:[x0,x1],zero:true},
        slope:'nhãn hệ số góc', icpt:'nhãn tung độ gốc', xint:'nhãn hoành độ gốc', stamp:'THẲNG ✔'} */
const BOX={x0:70,x1:500,y0:30,y1:280};
function scl(pts,ext,zx,zy,box=BOX,pad=.06){let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  if(ext)xs=xs.concat(ext.x||[]),ys=ys.concat(ext.y||[]);if(zx)xs.push(0);if(zy)ys.push(0);
  let a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);const dx=(b-a)||1,dy=(d-c)||1;a-=dx*pad;b+=dx*pad;c-=dy*pad;d+=dy*pad;
  return {X:x=>box.x0+(x-a)/(b-a)*(box.x1-box.x0),Y:y=>box.y1-(y-c)/(d-c)*(box.y1-box.y0),a,b,c,d};}
function axesAt(S,box,sw=2.5){const ax=(S.c<0&&S.d>0)?S.Y(0):box.y1,ay=(S.a<0&&S.b>0)?S.X(0):box.x0;
  return `<line x1="${box.x0-6}" y1="${ax}" x2="${box.x1+12}" y2="${ax}" stroke="#13213A" stroke-width="${sw}"/><path d="M${box.x1+14},${ax} l-10,-6 v12z" fill="#13213A"/>
   <line x1="${ay}" y1="${box.y1+6}" x2="${ay}" y2="${box.y0-12}" stroke="#13213A" stroke-width="${sw}"/><path d="M${ay},${box.y0-14} l-6,10 h12z" fill="#13213A"/>`;}
function fit(P){const n=P.length,mx=P.reduce((a,p)=>a+p[0],0)/n,my=P.reduce((a,p)=>a+p[1],0)/n;
  const m=P.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/P.reduce((a,p)=>a+(p[0]-mx)**2,0);return {m,b:my-m*mx};}
function morph(o,anim,box=BOX){const R=o.raw,Lc=o.lin,W=520,H=330;
  const P=R.pts,Q=P.map(p=>Lc.f(p[0],p[1])),F=fit(Q);
  const ex=Lc.ext||[Math.min(...Q.map(q=>q[0])),Math.max(...Q.map(q=>q[0]))];
  const Sr=scl(P,R.hline?{y:[R.hline.y]}:null,true,R.zy!==false,box),Sl=scl(Q,{x:ex,y:ex.map(x=>F.m*x+F.b)},Lc.zx,Lc.zy,box);
  let s=`<svg class="fsv" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biến số liệu thành đường thẳng">`;
  const rawAx=axesAt(Sr,box)+stx(box.x0+6,box.y0-14,R.yl,{a:'start',fs:18})+stx(box.x1+12,box.y1-10,R.xl,{a:'end',fs:18});
  let rc=(R.curves||[]).map(c=>{const pts=Array.from({length:81},(_,k)=>{const x=c.x0+(c.x1-c.x0)*k/80;return [Sr.X(x),Sr.Y(c.f(x))];});
    return `<path d="${poly(pts)}" fill="none" stroke="${c.c||'#94A3B8'}" stroke-width="3.5" ${c.dash?'stroke-dasharray="8 6"':''}/>`+(c.lab?stx(pts[c.lp??80][0]+(c.dx||-6),pts[c.lp??80][1]+(c.dy||-10),c.lab,{a:c.a||'end',fs:17,c:c.c||'#64748B'}):'');}).join('');
  if(R.hline)rc+=`<line x1="${box.x0}" x2="${box.x1}" y1="${Sr.Y(R.hline.y)}" y2="${Sr.Y(R.hline.y)}" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>`+stx(box.x1,Sr.Y(R.hline.y)-8,R.hline.lab,{a:'end',fs:16,c:'#64748B'});
  if(!anim){if(o.over)rc+=o.over;s+=rawAx+rc+P.map(p=>`<circle cx="${Sr.X(p[0]).toFixed(1)}" cy="${Sr.Y(p[1]).toFixed(1)}" r="6.5" fill="#fff" stroke="${FCOL.b}" stroke-width="3"/>`).join('');return s+'</svg>';}
  const linAx=axesAt(Sl,box)+stx(box.x0+6,box.y0-14,Lc.yl,{a:'start',fs:18,c:FCOL.p})+stx(box.x1+12,(Sl.c<0&&Sl.d>0?Sl.Y(0):box.y1)+28,Lc.xl,{a:'end',fs:18,c:FCOL.p});
  s+=fadeOut(rawAx+rc,.7,.5)+fadeIn(linAx,1.6,.6);
  const t0=.9,t1=2.2;
  s+=P.map((p,k)=>{const q=Q[k],x0=Sr.X(p[0]).toFixed(1),y0=Sr.Y(p[1]).toFixed(1),x1=Sl.X(q[0]).toFixed(1),y1=Sl.Y(q[1]).toFixed(1);
    return `<circle cx="${x0}" cy="${y0}" r="0" fill="#fff" stroke="${FCOL.b}" stroke-width="3"><animate attributeName="r" from="0" to="6.5" dur=".25s" begin="${(k*.06).toFixed(2)}s" fill="freeze"/>
     <animate attributeName="cx" from="${x0}" to="${x1}" dur="${t1-t0}s" begin="${t0}s" fill="freeze" calcMode="spline" keySplines=".5 0 .3 1" keyTimes="0;1"/>
     <animate attributeName="cy" from="${y0}" to="${y1}" dur="${t1-t0}s" begin="${t0}s" fill="freeze" calcMode="spline" keySplines=".5 0 .3 1" keyTimes="0;1"/>
     <animate attributeName="stroke" from="${FCOL.b}" to="${FCOL.p}" dur=".4s" begin="${t1}s" fill="freeze"/></circle>`;}).join('');
  const xa=ex[0],xb=ex[1],L1=[Sl.X(xa),Sl.Y(F.m*xa+F.b)],L2=[Sl.X(xb),Sl.Y(F.m*xb+F.b)];
  s+=draw1(`M${L1[0].toFixed(1)},${L1[1].toFixed(1)} L${L2[0].toFixed(1)},${L2[1].toFixed(1)}`,FCOL.r,4,.9,2.4);
  if(o.slope){const u=o.su!=null?xa+(xb-xa)*o.su:Q.length>3?Q[Math.floor(Q.length*.35)][0]:(xa+xb)/2,v=u+(xb-xa)*.28,A=[Sl.X(u),Sl.Y(F.m*u+F.b)],B=[Sl.X(v),Sl.Y(F.m*v+F.b)],up=F.m>0;
    const tri=`<path d="M${A[0].toFixed(1)},${A[1].toFixed(1)} H${B[0].toFixed(1)} V${B[1].toFixed(1)}" fill="none" stroke="${FCOL.g}" stroke-width="3" stroke-dasharray="6 4"/>`
      +stx(B[0]+8,(A[1]+B[1])/2+6,o.slope,{a:'start',fs:18,c:FCOL.g});
    s+=fadeIn(tri,3.3,.5);}
  if(o.icpt){const y=Sl.Y(F.b),x=(Sl.a<0&&Sl.b>0)?Sl.X(0):box.x0;s+=fadeIn(`<circle cx="${x}" cy="${y}" r="7.5" fill="${FCOL.o}" stroke="#fff" stroke-width="2"/>`+stx(x+12,y+(F.m>0?22:-12),o.icpt,{a:'start',fs:17,c:FCOL.o}),3.9,.5);}
  if(o.xint){const xi=-F.b/F.m,x=Sl.X(xi),y=(Sl.c<0&&Sl.d>0)?Sl.Y(0):box.y1;s+=fadeIn(`<circle cx="${x}" cy="${y}" r="7.5" fill="${FCOL.y}" stroke="#fff" stroke-width="2"/>`+stx(x,y+28,o.xint,{fs:17,c:'#8A6500'}),4.4,.5);}
  if(o.stamp!==false)s+=stamp(box.x1-70,box.y0+14,o.stamp||'THẲNG ✔',FCOL.g,4.6);
  if(o.over)s+=o.over;
  return s+'</svg>';}

/* ---- sơ đồ phản ứng: hằng số k ghi trên (dưới) mũi tên ---- */
function rxn(type,cx,cy){const SC={A:FCOL.b,R:FCOL.o,S:FCOL.g},kk=i=>`${iv('k')}${sb(i)}`;
  const sp=(n,x,y)=>`<circle cx="${x}" cy="${y}" r="16" fill="${SC[n]}"/>${stx(x,y+6,n,{fs:18,c:'#fff',sw:0})}`;
  const ar=(x1,y1,x2,y2,lab,dy)=>{const a=Math.atan2(y2-y1,x2-x1),h=10;
    return `<line x1="${x1}" y1="${y1}" x2="${(x2-Math.cos(a)*h).toFixed(1)}" y2="${(y2-Math.sin(a)*h).toFixed(1)}" stroke="${FINK}" stroke-width="2.6"/><path d="M${x2},${y2} l${(-h*Math.cos(a)+h*.5*Math.sin(a)).toFixed(1)},${(-h*Math.sin(a)-h*.5*Math.cos(a)).toFixed(1)} l${(-h*Math.sin(a)).toFixed(1)},${(h*Math.cos(a)).toFixed(1)}z" fill="${FINK}"/>`
      +stx((x1+x2)/2,(y1+y2)/2+dy,lab,{fs:18,c:FCOL.p});};
  let s='',w=0;
  if(type==='ser'){w=250;s=sp('A',cx-100,cy)+ar(cx-82,cy,cx-18,cy,kk(1),-9)+sp('R',cx,cy)+ar(cx+18,cy,cx+82,cy,kk(2),-9)+sp('S',cx+100,cy);}
  if(type==='rev'){w=170;s=sp('A',cx-60,cy)+sp('R',cx+60,cy)
    +`<line x1="${cx-42}" y1="${cy-5}" x2="${cx+34}" y2="${cy-5}" stroke="${FINK}" stroke-width="2.6"/><path d="M${cx+42},${cy-5} l-11,-6 v6z" fill="${FINK}"/>`+stx(cx,cy-13,kk(1),{fs:18,c:FCOL.p})
    +`<line x1="${cx+42}" y1="${cy+5}" x2="${cx-34}" y2="${cy+5}" stroke="${FINK}" stroke-width="2.6"/><path d="M${cx-42},${cy+5} l11,6 v-6z" fill="${FINK}"/>`+stx(cx,cy+27,kk(2),{fs:18,c:FCOL.p});}
  if(type==='par'){w=180;s=sp('A',cx-60,cy)+ar(cx-44,cy-7,cx+40,cy-24,kk(1),-12)+ar(cx-44,cy+7,cx+40,cy+24,kk(2),24)+sp('R',cx+58,cy-27)+sp('S',cx+58,cy+27);}
  const hh=type==='ser'?44:type==='rev'?62:86;
  return `<g><rect x="${cx-w/2}" y="${cy-hh/2}" width="${w}" height="${hh}" rx="14" fill="#fff" stroke="#DDD6FE" stroke-width="2.5"/>${s}</g>`;}

/* ---- bảng ba phép thử: chỉ một đồ thị thẳng ---- */
function tri3(o,anim){const W=520,H=330;let s=`<svg class="fsv" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ba cách vẽ">`;
  o.panels.forEach((p,k)=>{const bx={x0:22+k*168,x1:22+k*168+138,y0:80,y1:250},Q=o.pts.map(q=>p.f(q[0],q[1])),S=scl(Q,null,false,false,bx,.1),b=(.5+k*1.3).toFixed(1);
    let g=`<rect x="${bx.x0-14}" y="${bx.y0-44}" width="${bx.x1-bx.x0+28}" height="${bx.y1-bx.y0+92}" rx="14" fill="#F8FAFF" stroke="#DCE3EE" stroke-width="2"/>`
      +stx((bx.x0+bx.x1)/2,bx.y0-18,p.yl,{fs:18})+`<line x1="${bx.x0}" y1="${bx.y1}" x2="${bx.x1}" y2="${bx.y1}" stroke="${FINK}" stroke-width="2"/><line x1="${bx.x0}" y1="${bx.y1}" x2="${bx.x0}" y2="${bx.y0}" stroke="${FINK}" stroke-width="2"/>`
      +stx(bx.x1,bx.y1+22,iv('t'),{a:'end',fs:17});
    if(anim){g+=Q.map((q,j)=>`<circle cx="${S.X(q[0]).toFixed(1)}" cy="${S.Y(q[1]).toFixed(1)}" r="0" fill="#fff" stroke="${FCOL.b}" stroke-width="2.5"><animate attributeName="r" from="0" to="5" dur=".2s" begin="${(+b+j*.06).toFixed(2)}s" fill="freeze"/></circle>`).join('');
      const F=fit(Q),a=Q[0][0],z=Q[Q.length-1][0];g+=draw1(`M${S.X(a).toFixed(1)},${S.Y(F.m*a+F.b).toFixed(1)} L${S.X(z).toFixed(1)},${S.Y(F.m*z+F.b).toFixed(1)}`,p.ok?FCOL.g:'#CBD5E1',3,.6,(+b+.6).toFixed(1),p.ok?'':'stroke-dasharray="6 6"');
      g+=stamp((bx.x0+bx.x1)/2,bx.y1+48,p.ok?'THẲNG ✔':'CONG ✘',p.ok?FCOL.g:FCOL.r,(+b+1).toFixed(1))+stx((bx.x0+bx.x1)/2,bx.y0-34,'',{});
      g=fadeIn(stx((bx.x0+bx.x1)/2,22,p.n,{fs:18,c:p.ok?FCOL.g:'#64748B'}),b,.3)+g;}
    else g+=stx((bx.x0+bx.x1)/2,22,p.n,{fs:18,c:'#64748B'});
    s+=g;});
  return s+'</svg>';}

/* ---- đồ thị nồng độ theo thời gian (phản ứng phức tạp) ---- */
function ctPlot(o,anim){const W=520,H=330,box=o.box||{x0:64,x1:o.w||500,y0:34,y1:280},S={X:t=>box.x0+t/o.tmax*(box.x1-box.x0),Y:c=>box.y1-c/(o.cmax||1.05)*(box.y1-box.y0)};
  let s=`<line x1="${box.x0}" y1="${box.y1}" x2="${box.x1+10}" y2="${box.y1}" stroke="#13213A" stroke-width="2.5"/><path d="M${box.x1+12},${box.y1} l-10,-6 v12z" fill="#13213A"/>
    <line x1="${box.x0}" y1="${box.y1}" x2="${box.x0}" y2="${box.y0-10}" stroke="#13213A" stroke-width="2.5"/><path d="M${box.x0},${box.y0-12} l-6,10 h12z" fill="#13213A"/>
    ${stx(box.x0+8,box.y0-4,o.yl||`${iv('C')}/${CAo}`,{a:'start',fs:17})}${stx(box.x1+10,box.y1-10,iv('t'),{a:'end',fs:18})}`;
  (o.hl||[]).forEach(h=>{s+=`<line x1="${box.x0}" x2="${box.x1}" y1="${S.Y(h.y)}" y2="${S.Y(h.y)}" stroke="${h.c||'#94A3B8'}" stroke-width="2" stroke-dasharray="7 6"/>`+stx(box.x1,S.Y(h.y)+(h.dy||-8),h.lab,{a:'end',fs:15,c:h.c||'#64748B'});});
  o.cv.forEach((c,k)=>{const pts=Array.from({length:121},(_,j)=>{const t=o.tmax*j/120;return [S.X(t),S.Y(c.f(t))];}),d=poly(pts),b=(.3+k*.5).toFixed(1);
    s+=anim?draw1(d,FCOL[c.c],4.5,2.2,b):`<path d="${d}" fill="none" stroke="${FCOL[c.c]}" stroke-width="4.5"/>`;
    const e=pts[c.lp??120];s+=(anim?fadeIn(stx(e[0]+(c.dx||-4),e[1]+(c.dy||-10),c.lab,{a:c.a||'end',fs:18,c:FCOL[c.c]}),(+b+1.6).toFixed(1),.4):stx(e[0]+(c.dx||-4),e[1]+(c.dy||-10),c.lab,{a:c.a||'end',fs:18,c:FCOL[c.c]}));
    if(anim&&c.dot)s+=`<circle r="7" fill="${FCOL[c.c]}" stroke="#fff" stroke-width="2"><animateMotion dur="5s" begin="${(+b+2.4).toFixed(1)}s" repeatCount="indefinite" path="${d}"/></circle>`;});
  return {s,S,box};}

/* ---------- giao diện thẻ ---------- */
function build(FG,FC,home,ch){
/* lời giải thích thu âm: audio/c<ch>-<số thẻ 2 chữ số>.mp3 — thẻ nào chưa có file thì nút tự ẩn */
const AU={el:null,i:-1,ok:{}},auSrc=i=>`audio/c${ch}-${String(i+1).padStart(2,'0')}.mp3`;
function auStop(){if(AU.el){AU.el.pause();AU.el=null;}AU.i=-1;const b=$('[data-fcau]');if(b)b.textContent='🔊 Nghe giải thích';}
function auProbe(i){const show=()=>{const b=$('[data-fcau]');if(b&&S.fc.i===i)b.hidden=false;};if(!ch)return;if(AU.ok[i]===true)return show();if(AU.ok[i]===false)return;
  fetch(auSrc(i),{method:'HEAD'}).then(r=>{AU.ok[i]=r.ok;if(r.ok)show();}).catch(()=>{AU.ok[i]=false;});}
function auPlay(){const i=S.fc.i,b=$('[data-fcau]');if(AU.el&&AU.i===i){auStop();return;}auStop();AU.el=new Audio(auSrc(i));AU.i=i;
  AU.el.addEventListener('ended',auStop);AU.el.play().catch(auStop);if(b)b.textContent='⏸ Dừng nghe';}
FC.forEach(c=>{if(!c.fig)return;const f=c.fig;c.fig=a=>f(a).replace(/X_A(\d?)/g,(_,d)=>`${iv('X')}${sb('A'+d)}`).replace(/kτ/g,`${iv('k')}${TAU}`);});
function fcList(){const g=S.fc.g;return FC.map((_,i)=>i).filter(i=>g==='all'||FC[i].g===g);}
function vFC(){S.fc??={i:0,side:0,k:0,g:'all',mk:{}};if(S.fc.g!=='all'&&!FG[S.fc.g])S.fc.g='all';if(!FC[S.fc.i])S.fc.i=0;S.fc.mk??={};const F=S.fc,L=fcList();if(!L.includes(F.i))F.i=L[0];
  const i=F.i,c=FC[i],pos=L.indexOf(i),[ge,gn,gc]=FG[c.g];if(AU.i!==i||!F.side)auStop();
  const ok=Object.values(F.mk).filter(v=>v>0).length,no=Object.values(F.mk).filter(v=>v<0).length;
  const chips=[['all','Tất cả',FC.length],...Object.entries(FG).map(([k,v])=>[k,v[0]+' '+v[1],FC.filter(x=>x.g===k).length])]
    .map(([k,n,m])=>`<button class="fchipb" data-fcg="${k}" aria-pressed="${F.g===k}">${n} <small>${m}</small></button>`).join('');
  const dots=L.map(j=>`<button class="fdot${j===i?' on':''}${F.mk[j]>0?' ok':F.mk[j]<0?' no':''}" data-fcj="${j}" aria-label="Thẻ ${L.indexOf(j)+1}" style="--gc:${FG[FC[j].g][2]}">${L.indexOf(j)+1}</button>`).join('');
  const front=`<div class="fcf"><div><span class="fchip">${ge} ${gn}</span><p class="fcq">${c.q}</p>
     <p class="hint">${NHA?'Tự trả lời trong đầu (hoặc ra giấy), rồi bấm <b>Lật thẻ</b> (phím cách) để kiểm tra.':'Gọi sinh viên trả lời, rồi bấm <b>Lật thẻ</b> (phím cách).'}</p></div>
     ${c.fig?`<div class="fcfig nolab">${c.fig(false)}</div>`:''}</div>`;

    catch(_){break;}}

function gsMsg(r){const p=S.sv&&payload(r),s=(S.sent||{})[r],w=(S.gq||[]).find(x=>x.vn===RD[r].n);
  if(!p||(!p.dung&&!p.sai&&!p.xong))return ['','Vòng này chưa có câu trả lời nào nên chưa gửi kết quả.'];

  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

<script>/* MOB-KTPU v2 */(()=>{

 const SH=[['‹ Thẻ trước','‹ Trước'],['Thẻ sau ›','Sau ›'],['⟳ Chạy lại hình','⟳ Hình'],['🔊 Nghe giải thích','🔊 Nghe'],

 const FULL=new Map(SH.map(([a,b])=>[b,a])),SHORT=new Map(SH);
 function relabel(root){(root||document).querySelectorAll('.ctrl .btn').forEach(b=>{if(b.children.length)return;
   const t=b.textContent.trim();if(mq.matches&&SHORT.has(t)){b.title=t;b.textContent=SHORT.get(t);}
   else if(!mq.matches&&FULL.has(t)){b.textContent=FULL.get(t);}});}
 function keyHints(root){if(!touch.matches)return;const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);let n;const L=[];
   while(n=w.nextNode())if(/\(phím [^)]*\)|\(hoặc phím [^)]*\)/.test(n.nodeValue))L.push(n);
   L.forEach(n=>{n.nodeValue=n.nodeValue.replace(/\s*\(phím cách\)/g,' (hoặc chạm vào thẻ)').replace(/\s*\((hoặc )?phím [^)]*\)/g,'');});}
 function track(){const t=document.getElementById('tabs');if(!t||t.querySelector('.mtrack'))return;
   const bs=[...t.children].filter(b=>b.matches('button[data-go]')&&!/^(home|hd|the)$/.test(b.dataset.go));if(!bs.length)return;
   [...t.children].forEach(b=>{if(b.matches('button')&&/^(home|hd|the)$/.test(b.dataset.go)&&!b.querySelector('.mi')){
     const m=b.textContent.trim().match(/^(\S+)\s+(.*)$/);if(m)b.innerHTML=`<b class="mi">${m[1]}</b><span>${m[2]}</span>`;b.title=b.textContent;}});
   const w=document.createElement('span');w.className='mtrack';w.innerHTML='<span class="mlab">🎮<br>Vòng</span>';bs[0].before(w);bs.forEach(b=>w.append(b));}
 function centerTab(){const t0=document.getElementById('tabs');if(!t0||!mq.matches)return;const t=t0.querySelector('.mtrack')||t0;const b=t.querySelector('[aria-current]');if(!b)return;
   const tr=t.getBoundingClientRect(),br=b.getBoundingClientRect();const x=t.scrollLeft+(br.left-tr.left)-(tr.width-br.width)/2;
   t.scrollTo({left:Math.max(0,x),behavior:'smooth'});}
 let q=0;function run(){if(q)return;q=requestAnimationFrame(()=>{q=0;track();relabel();keyHints();centerTab();});}
 new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
 mq.addEventListener?.('change',run);run();
 // chạm dòng luật chơi để mở/thu
